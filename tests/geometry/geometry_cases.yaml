schema_version: 2
suite_name: geometry_acceptance_suite
language: nl-NL
description: >-
  Acceptance tests for verify_geometry module (Tasks G1, G2, G3, G4, G5and G6).

conventions:
  status_values: [verified, wrong, unverifiable]
  check_types:
    - angle_sum
    - shape_formula
    - scale_factor
    - trig_ratio
    - sine_rule
    - cosine_rule
    - point_distance
    - midpoint
  angle_sum:
    input_format: "<shape>: <angle>°, <angle>°"
    supported_shapes:
      driehoek: 180
      vierhoek: 360
      gestrekte hoek: 180
      volle hoek: 360
    rules: >-
      Every angle token in the input must end with a degree sign (°).
      Unmarked comma-separated numbers return ambiguous_comma_notation.
      In submitted_answer, the degree sign is optional ("73°" or "73").
      The calculated exact_value uses SymPy string notation via _serialize_exact.
  shape_formula:
    input_format: "<quantity> <shape>"
    supported_shapes:
      rechthoek: [omtrek, oppervlakte]
      vierkant: [omtrek, oppervlakte]
      driehoek: [omtrek, oppervlakte]
      parallellogram: [omtrek, oppervlakte]
      trapezium: [oppervlakte]
      cirkel: [omtrek, oppervlakte]
      balk: [oppervlakte, inhoud]
      kubus: [oppervlakte, inhoud]
      cilinder: [oppervlakte, inhoud]
      prisma: [inhoud]
      piramide: [inhoud]
      kegel: [oppervlakte, inhoud]
      bol: [oppervlakte, inhoud]
    rules: >-
      Dimensions are provided via values (e.g. {"l": "8", "b": "3,5"}).
      Units are optional. If units are present, the dimension must match (length, area, volume).
      Wrong unit dimension returns misconception wrong_unit_dimension.
      Exact values with pi (e.g. 9π) are serialized as "9*pi".
      Rounding is accepted only when requested by task_instruction.
  scale_factor:
    input_format: "<quantity>"  # "lengte", "oppervlakte" or "inhoud"
    rules: >-
      Values must supply the scale factor 'k' and the original quantity 'origineel'
      (or 'lengte', 'oppervlakte', 'inhoud').
      Scaling relationships:
        - length: original * k
        - area: original * k^2
        - volume: original * k^3
      Misconceptions:
        - area multiplied by k instead of k^2 (area_scaled_by_k)
        - volume multiplied by k instead of k^3 (volume_scaled_by_k)
        - volume multiplied by k^2 instead of k^3 (volume_scaled_by_k2)
      Scale factor k must be strictly positive (k > 0); otherwise return impossible_scale_factor.
  trig_ratio:
    input_format: "<ratio>(<angle>) = <numerator> / <denominator>"  # e.g. "sin(A) = overstaande / schuine zijde"
    rules: >-
      Supported ratios: sin, cos, tan in a right-angled triangle.
      Angles must always be in degrees (°); radians are out of scope (radians_not_supported).
      Supports calculating a missing side or finding an angle from sides (inverse).
      Submitted answer can be of the form "overstaande = 5" or bare "5", and "A = 45°" or "45°".
      Exact trigonometric values (e.g. 30°, 45°, 60°) are compared directly.
      Approximated answers are verified only when task_instruction explicitly requests rounding.
      Misconceptions include swapping sine and cosine (swapped_sin_cos).
  sine_rule:
    input_format: "a / sin(A) = b / sin(B)"
    rules: >-
      Values supply 3 known components among a, b, A, B.
      Angles must be in degrees (°).
      The ambiguous case of the sinusregel (two possible triangles, SSA) must be reported as ambiguous_triangle.
      Impossible triangle configurations (sin > 1) return impossible_triangle.
  cosine_rule:
    input_format: "a² = b² + c² - 2bc · cos(A)"
    rules: >-
      Values supply 3 known components among a, b, c, A.
      Angles must be in degrees (°).
      Misconceptions include adding 2bc·cos(A) instead of subtracting (cosine_rule_added_instead_of_subtracted).
      Triangle inequality violations or impossible cos values (|cos| > 1) return impossible_triangle.
  point_distance:
    input_format: "A(x1, y1), B(x2, y2)"  # e.g. "A(1, 2), B(4, 6)" or with semicolons "A(2,5; 4), B(5; 8)"
    rules: >-
      Calculates the Euclidean distance between two points: d = sqrt((x2 - x1)^2 + (y2 - y1)^2).
      In Dutch notation, semicolon (;) is the coordinate separator when decimal commas are present (e.g. (2,5; 4)).
      Missing semicolon with ambiguous decimal commas (e.g. (1,5) or (1,5, 2)) returns ambiguous_comma_notation.
      Period notation for decimals returns ambiguous_dot_notation.
      Exact radical form (e.g. "sqrt(2)" or "√2") is serialized as exact_value.
      Rounding is accepted only when requested by task_instruction.
      Misconceptions include Manhattan distance (manhattan_distance).
  midpoint:
    input_format: "A(x1, y1), B(x2, y2)"  # e.g. "A(1, 2), B(5, 6)"
    rules: >-
      Calculates the midpoint coordinates: M = ((x1 + x2)/2, (y1 + y2)/2).
      Dutch coordinate notation uses semicolon (;) when coordinates contain decimal commas, e.g. "(2,5; 4)".
      Submitted answer can be "(x, y)", "(x; y)", "M(x, y)", or "M(x; y)".
      Missing semicolon with ambiguous decimal comma notation returns ambiguous_comma_notation.
      Period notation for decimals returns ambiguous_dot_notation.
      Misconceptions include subtracting coordinates instead of adding (midpoint_subtracted_coordinates)
      or forgetting to divide by 2 (midpoint_forgot_divide_by_two).
cases:
  # =========================================================================
  # G1 — Degrees and angle sums (angle_sum)
  # =========================================================================
  - id: GEO001
    title: Triangle angle sum with integer degrees
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 35°, 72°"
    submitted_answer: "73°"
    expected:
      status: verified
      exact_value: "73"
      unit: "°"

  - id: GEO002
    title: Triangle angle sum with Dutch decimal comma
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 42,5°, 65,5°"
    submitted_answer: "72°"
    expected:
      status: verified
      exact_value: "72"
      unit: "°"

  - id: GEO003
    title: Triangle angle sum with decimal result
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 30°, 85,5°"
    submitted_answer: "64,5°"
    expected:
      status: verified
      exact_value: "129/2"
      unit: "°"

  - id: GEO004
    title: Quadrilateral angle sum (360 degrees)
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "vierhoek: 90°, 85°, 110°"
    submitted_answer: "75°"
    expected:
      status: verified
      exact_value: "75"
      unit: "°"

  - id: GEO005
    title: Straight angle (180 degrees)
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "gestrekte hoek: 124°"
    submitted_answer: "56°"
    expected:
      status: verified
      exact_value: "56"
      unit: "°"

  - id: GEO006
    title: Full angle (360 degrees)
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "volle hoek: 120°, 150°"
    submitted_answer: "90°"
    expected:
      status: verified
      exact_value: "90"
      unit: "°"

  - id: GEO007
    title: Submitted answer without degree sign is accepted
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 35°, 72°"
    submitted_answer: "73"
    expected:
      status: verified
      exact_value: "73"
      unit: "°"

  - id: GEO008
    title: Misconception - Triangle sum evaluated as 360 degrees
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 35°, 72°"
    submitted_answer: "253°"
    expected:
      status: wrong
      exact_value: "73"
      unit: "°"
      misconception: triangle_sum_as_360

  - id: GEO009
    title: Arithmetic calculation error in triangle sum
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 50°, 60°"
    submitted_answer: "80°"
    expected:
      status: wrong
      exact_value: "70"
      unit: "°"

  - id: GEO010
    title: Impossible angles - Known angle sum exceeds 180 degrees
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "driehoek: 110°, 75°"
    submitted_answer: "-5°"
    expected:
      status: unverifiable
      reason: impossible_angles

  - id: GEO011
    title: Impossible angles - Remaining angle is zero
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "driehoek: 90°, 90°"
    submitted_answer: "0°"
    expected:
      status: unverifiable
      reason: impossible_angles

  - id: GEO012
    title: Impossible angles - Angle smaller or equal to zero
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "driehoek: 0°, 50°"
    submitted_answer: "130°"
    expected:
      status: unverifiable
      reason: impossible_angles

  - id: GEO013
    title: Not enough information - Multiple unknowns in quadrilateral
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "vierhoek: 90°, 85°"
    submitted_answer: "185°"
    expected:
      status: unverifiable
      reason: not_enough_information

  - id: GEO014
    title: Unsupported geometric shape
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "vijfhoek: 100°, 120°"
    submitted_answer: "320°"
    expected:
      status: unverifiable
      reason: unsupported_shape

  - id: GEO015
    title: Ambiguous comma notation - Missing degree signs in input
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "driehoek: 42,5, 65,5"
    submitted_answer: "72°"
    expected:
      status: unverifiable
      reason: ambiguous_comma_notation

  - id: GEO016
    title: Reject period-based notation in degrees
    check_type: angle_sum
    curriculum_scope: tool_boundary_test
    input: "driehoek: 35.5°, 72°"
    submitted_answer: "72,5°"
    expected:
      status: unverifiable
      reason: ambiguous_dot_notation
      parser_invoked: false

  - id: GEO017
    title: Missing submitted answer returns exact value
    check_type: angle_sum
    curriculum_scope: vwo1_candidate
    input: "driehoek: 35°, 72°"
    expected:
      status: unverifiable
      reason: no_claim_to_check
      exact_value: "73"
      unit: "°"

  # =========================================================================
  # G2 — Perimeter, area and volume with a named formula (shape_formula)
  # =========================================================================
  - id: GEO018
    title: Rectangle area with decimal comma
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte rechthoek"
    values: {l: "8", b: "3,5"}
    submitted_answer: "28"
    expected:
      status: verified
      exact_value: "28"

  - id: GEO019
    title: Rectangle perimeter
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "omtrek rechthoek"
    values: {l: "8", b: "3,5"}
    submitted_answer: "23"
    expected:
      status: verified
      exact_value: "23"

  - id: GEO020
    title: Triangle area (half times base times height)
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte driehoek"
    values: {basis: "6", hoogte: "4"}
    submitted_answer: "12"
    expected:
      status: verified
      exact_value: "12"

  - id: GEO021
    title: Misconception - Triangle area forgot half factor
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte driehoek"
    values: {basis: "6", hoogte: "4"}
    submitted_answer: "24"
    expected:
      status: wrong
      exact_value: "12"
      misconception: forgot_half_triangle

  - id: GEO022
    title: Circle circumference exact with pi
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "omtrek cirkel"
    values: {r: "3"}
    submitted_answer: "6π"
    expected:
      status: verified
      exact_value: "6*pi"

  - id: GEO023
    title: Circle area exact with pi
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte cirkel"
    values: {r: "3"}
    submitted_answer: "9π"
    expected:
      status: verified
      exact_value: "9*pi"

  - id: GEO024
    title: Misconception - Circle circumference and area swapped
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte cirkel"
    values: {r: "3"}
    submitted_answer: "6π"
    expected:
      status: wrong
      exact_value: "9*pi"
      misconception: swapped_circumference_and_area

  - id: GEO025
    title: Circle area rounded with explicit rounding instruction
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte cirkel"
    values: {r: "3"}
    submitted_answer: "28,27"
    task_instruction: "Rond af op 2 decimalen."
    expected:
      status: verified
      exact_value: "9*pi"
      rounded_answer: "28,27"
      decimal_places: 2

  - id: GEO026
    title: Circle area rounded without rounding instruction is wrong
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte cirkel"
    values: {r: "3"}
    submitted_answer: "28,27"
    expected:
      status: wrong
      exact_value: "9*pi"

  - id: GEO027
    title: Unit dimension check with matching dimension (cm and cm2)
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte rechthoek"
    values: {l: "8 cm", b: "3 cm"}
    submitted_answer: "24 cm²"
    expected:
      status: verified
      exact_value: "24"
      unit: "cm²"

  - id: GEO028
    title: Misconception - Wrong unit dimension (length for area)
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte rechthoek"
    values: {l: "8 cm", b: "3 cm"}
    submitted_answer: "24 cm"
    expected:
      status: wrong
      exact_value: "24"
      misconception: wrong_unit_dimension

  - id: GEO029
    title: Cuboid volume (length times width times height)
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "inhoud balk"
    values: {l: "4", b: "3", h: "5"}
    submitted_answer: "60"
    expected:
      status: verified
      exact_value: "60"

  - id: GEO030
    title: Pyramid volume (one third times base area times height)
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "inhoud piramide"
    values: {G: "15", h: "6"}
    submitted_answer: "30"
    expected:
      status: verified
      exact_value: "30"

  - id: GEO031
    title: Missing submitted answer in formula substitution
    check_type: shape_formula
    curriculum_scope: vwo1_candidate
    input: "oppervlakte rechthoek"
    values: {l: "8", b: "3,5"}
    expected:
      status: unverifiable
      reason: no_claim_to_check
      exact_value: "28"

  - id: GEO032
    title: Missing variable in values dictionary
    check_type: shape_formula
    curriculum_scope: tool_boundary_test
    input: "oppervlakte rechthoek"
    values: {l: "8"}
    submitted_answer: "28"
    expected:
      status: unverifiable
      reason: missing_variables

  - id: GEO033
    title: Ambiguous dot notation in values
    check_type: shape_formula
    curriculum_scope: tool_boundary_test
    input: "oppervlakte rechthoek"
    values: {l: "8.5", b: "2"}
    submitted_answer: "17"
    expected:
      status: unverifiable
      reason: ambiguous_dot_notation
      parser_invoked: false

  - id: GEO034
    title: Unsupported geometric shape or quantity
    check_type: shape_formula
    curriculum_scope: tool_boundary_test
    input: "inhoud ellips"
    values: {a: "4", b: "3"}
    submitted_answer: "36"
    expected:
      status: unverifiable
      reason: unsupported_shape

  # =========================================================================
  # G3 — Scale factor (scale_factor)
  # =========================================================================
  - id: GEO035
    title: Length scaling with integer factor
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "lengte"
    values: {k: "3", origineel: "5"}
    submitted_answer: "15"
    expected:
      status: verified
      exact_value: "15"

  - id: GEO036
    title: Area scaling with factor squared (k^2)
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "oppervlakte"
    values: {k: "3", origineel: "4"}
    submitted_answer: "36"
    expected:
      status: verified
      exact_value: "36"

  - id: GEO037
    title: Misconception - Area multiplied by k instead of k^2
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "oppervlakte"
    values: {k: "3", origineel: "4"}
    submitted_answer: "12"
    expected:
      status: wrong
      exact_value: "36"
      misconception: area_scaled_by_k

  - id: GEO038
    title: Volume scaling with factor cubed (k^3)
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "inhoud"
    values: {k: "2", origineel: "5"}
    submitted_answer: "40"
    expected:
      status: verified
      exact_value: "40"

  - id: GEO039
    title: Misconception - Volume multiplied by k instead of k^3
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "inhoud"
    values: {k: "2", origineel: "5"}
    submitted_answer: "10"
    expected:
      status: wrong
      exact_value: "40"
      misconception: volume_scaled_by_k

  - id: GEO040
    title: Length scaling with decimal scale factor
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "lengte"
    values: {k: "1,5", origineel: "6"}
    submitted_answer: "9"
    expected:
      status: verified
      exact_value: "9"

  - id: GEO041
    title: Area scaling with units (cm^2)
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "oppervlakte"
    values: {k: "2", origineel: "5 cm²"}
    submitted_answer: "20 cm²"
    expected:
      status: verified
      exact_value: "20"
      unit: "cm²"

  - id: GEO042
    title: Rounded area scaling with rounding instruction
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "oppervlakte"
    values: {k: "1,4", origineel: "3"}
    submitted_answer: "5,9"
    task_instruction: "Rond af op 1 decimaal."
    expected:
      status: verified
      exact_value: "147/25"
      rounded_answer: "5,9"
      decimal_places: 1

  - id: GEO043
    title: Impossible scale factor (k <= 0)
    check_type: scale_factor
    curriculum_scope: tool_boundary_test
    input: "lengte"
    values: {k: "-2", origineel: "5"}
    submitted_answer: "-10"
    expected:
      status: unverifiable
      reason: impossible_scale_factor

  - id: GEO044
    title: Missing submitted answer returns exact value
    check_type: scale_factor
    curriculum_scope: vwo1_candidate
    input: "lengte"
    values: {k: "3", origineel: "5"}
    expected:
      status: unverifiable
      reason: no_claim_to_check
      exact_value: "15"

  - id: GEO045
    title: Ambiguous period notation in scale factor value
    check_type: scale_factor
    curriculum_scope: tool_boundary_test
    input: "lengte"
    values: {k: "1.5", origineel: "6"}
    submitted_answer: "9"
    expected:
      status: unverifiable
      reason: ambiguous_dot_notation
      parser_invoked: false

  # =========================================================================
  # G4 — Sine, cosine and tangent in a right triangle (trig_ratio)
  # =========================================================================
  - id: GEO046
    title: Calculate opposite side using sine (exact 30 degrees)
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "sin(A) = overstaande / schuine zijde"
    values: {A: "30°", "schuine zijde": "10"}
    submitted_answer: "overstaande = 5"
    expected:
      status: verified
      exact_value: "5"

  - id: GEO047
    title: Calculate opposite side with bare number answer
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "sin(A) = overstaande / schuine zijde"
    values: {A: "30°", "schuine zijde": "10"}
    submitted_answer: "5"
    expected:
      status: verified
      exact_value: "5"

  - id: GEO048
    title: Calculate adjacent side using cosine (exact 60 degrees)
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "cos(A) = aanliggende / schuine zijde"
    values: {A: "60°", "schuine zijde": "8"}
    submitted_answer: "aanliggende = 4"
    expected:
      status: verified
      exact_value: "4"

  - id: GEO049
    title: Calculate opposite side using tangent (exact 45 degrees)
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "tan(A) = overstaande / aanliggende zijde"
    values: {A: "45°", "aanliggende zijde": "7"}
    submitted_answer: "overstaande = 7"
    expected:
      status: verified
      exact_value: "7"

  - id: GEO050
    title: Inverse tangent - find angle from equal legs (45 degrees)
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "tan(A) = overstaande / aanliggende zijde"
    values: {"overstaande": "5", "aanliggende zijde": "5"}
    submitted_answer: "A = 45°"
    expected:
      status: verified
      exact_value: "45"
      unit: "°"

  - id: GEO051
    title: Inverse sine - rounded angle with rounding instruction
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "sin(A) = overstaande / schuine zijde"
    values: {"overstaande": "3", "schuine zijde": "5"}
    submitted_answer: "36,9°"
    task_instruction: "Rond af op 1 decimaal."
    expected:
      status: verified
      rounded_answer: "36,9"
      decimal_places: 1
      unit: "°"

  - id: GEO052
    title: Inverse sine - rounded angle without rounding instruction is wrong
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "sin(A) = overstaande / schuine zijde"
    values: {"overstaande": "3", "schuine zijde": "5"}
    submitted_answer: "36,9°"
    expected:
      status: wrong

  - id: GEO053
    title: Misconception - Sine and cosine swapped
    check_type: trig_ratio
    curriculum_scope: vwo1_candidate
    input: "sin(A) = overstaande / schuine zijde"
    values: {A: "60°", "schuine zijde": "10"}
    submitted_answer: "5"
    expected:
      status: wrong
