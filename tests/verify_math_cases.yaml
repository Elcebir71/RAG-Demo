schema_version: 2
suite_name: verify_math_initial_regression_suite
language: nl-NL
description: >-
  Initial acceptance tests for verify_math. These are synthetic verification cases,
  not an official VWO 1 curriculum map. Cases marked out_of_curriculum_tool_test
  test the verifier's general mathematical behavior beyond the intended first level.

conventions:
  status_values: [verified, wrong, unverifiable]
  check_types:
    - arithmetic
    - answer_equivalence
    - expression_equivalence
    - equation_solution
    - step_validation
    - formula_substitution    # put given values into a formula, compare with submitted_answer
    - formula_rewrite         # rewrite a formula for another letter (taken from the answer's left side)
  letters: >-
    Any single letter can be a variable (a, b, p, t, K ...); letters are case-sensitive.
    e, i and π are reserved (Euler's number, imaginary unit, pi) and return unverifiable for now.
    Multi-letter names (woordformules such as 'aantal') are not supported yet.
    When an equation has more than one letter, the unknown must be given in 'variable'.
  step_numbering: "Step 1 is the original equation; failed_step refers to the first invalid step."
  solution_set_format:
    finite: "{kind: finite, values: [...]}  # exact values as strings"
    empty: "{kind: empty}"
    all_reals: "{kind: all_reals}"

cases:
  - id: VM001
    title: Fraction arithmetic with Dutch decimal comma
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "-3/4 + 2/3 × (-1,5)"
    submitted_answer: "-7/4"
    expected: {status: verified, exact_value: "-7/4"}
    notes: "In this arithmetic-expression context, -1,5 is the decimal number -1.5."
  - id: VM002
    title: Decimal addition
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "1,25 + 0,5"
    submitted_answer: "1,75"
    expected: {status: verified, exact_value: "7/4"}
  - id: VM003
    title: Division written with colon
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 : 0,5"
    submitted_answer: "8"
    expected: {status: verified, exact_value: "8"}
  - id: VM004
    title: Parentheses and multiplication
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 × (1,5 + 0,5)"
    submitted_answer: "8"
    expected: {status: verified, exact_value: "8"}
  - id: VM005
    title: Incorrect arithmetic answer
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 × (1,5 + 0,5)"
    submitted_answer: "7"
    expected: {status: wrong, exact_value: "8"}
  - id: VM021
    title: Mixed-number notation
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "1 3/4 + 1/4"
    submitted_answer: "2"
    expected: {status: verified, exact_value: "2"}
    notes: "Recognise 1 3/4 as a mixed number, never implicit multiplication."
  - id: VM031
    title: Unicode minus and middle dot
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "−2 · (−3)"
    submitted_answer: "6"
    expected: {status: verified, exact_value: "6"}
  - id: VM032
    title: Superscript powers
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "3² + 4²"
    submitted_answer: "25"
    expected: {status: verified, exact_value: "25"}
  - id: VM033
    title: Division by zero
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 : 0"
    submitted_answer: "0"
    expected: {status: wrong, exact_value: undefined}
    notes: "Do not return zoo/oo as a valid answer."
  - id: VM022
    title: Fraction answer expressed as a terminating decimal
    check_type: answer_equivalence
    curriculum_scope: vwo1_candidate
    input: "-7/4"
    submitted_answer: "-1,75"
    expected: {status: verified, exact_value: "-7/4"}

  - id: VM006
    title: Equivalent expanded expression
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "2(x + 3) = 2x + 6"
    expected: {status: verified, equivalent: true}
  - id: VM007
    title: Correct distribution of a negative factor
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "-2(x - 3) = -2x + 6"
    expected: {status: verified, equivalent: true}
  - id: VM008
    title: Incorrect distribution of a negative factor
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "-2(x - 3) = -2x - 6"
    expected: {status: wrong, equivalent: false}
    misconception: "The negative factor was not distributed correctly to the second term."
  - id: VM009
    title: Collecting like terms
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "3x + 2x = 5x"
    expected: {status: verified, equivalent: true}
  - id: VM010
    title: Polynomial factorisation identity
    check_type: expression_equivalence
    curriculum_scope: out_of_curriculum_tool_test
    input: "x^2 - 1 = (x - 1)(x + 1)"
    expected: {status: verified, equivalent: true}
    notes: "General tool test, not asserted to be a VWO 1 topic."

  - id: VM011
    title: Correct solution to a linear equation
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "3x - 5 = 7"
    submitted_answer: "x = 4"
    expected: {status: verified, solution_set: {kind: finite, values: ["4"]}}
  - id: VM012
    title: Incorrect solution to a linear equation
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "3x - 5 = 7"
    submitted_answer: "x = 3"
    expected: {status: wrong, solution_set: {kind: finite, values: ["4"]}}
  - id: VM013
    title: Negative solution to a linear equation
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "2x + 6 = 0"
    submitted_answer: "x = -3"
    expected: {status: verified, solution_set: {kind: finite, values: ["-3"]}}
  - id: VM014
    title: Incomplete solution set for a quadratic equation
    check_type: equation_solution
    curriculum_scope: out_of_curriculum_tool_test
    input: "x^2 = 9"
    submitted_answer: "x = 3"
    expected: {status: wrong, solution_set: {kind: finite, values: ["-3", "3"]}}
    notes: "A single valid root is insufficient when the full solution set is requested."
  - id: VM015
    title: Exact decimal representation of a rational solution
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "2x = 1"
    submitted_answer: "x = 0,5"
    expected: {status: verified, solution_set: {kind: finite, values: ["1/2"]}}
  - id: VM023
    title: Rounded answer without a rounding instruction
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "3x = 1"
    submitted_answer: "x = 0,33"
    task_instruction: null
    expected: {status: wrong, solution_set: {kind: finite, values: ["1/3"]}}
  - id: VM024
    title: Rounded answer when two decimals are explicitly requested
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "3x = 1"
    submitted_answer: "x = 0,33"
    task_instruction: "Rond af op 2 decimalen."
    expected:
      status: verified
      solution_set: {kind: finite, values: ["1/3"]}
      rounded_answer: "0,33"
      decimal_places: 2
  - id: VM025
    title: Equation has no solution
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "2x + 1 = 2x + 3"
    submitted_answer: "geen oplossing"
    expected: {status: verified, solution_set: {kind: empty}}
  - id: VM026
    title: Equation is true for every real number
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "2(x + 1) = 2x + 2"
    submitted_answer: "alle getallen"
    expected: {status: verified, solution_set: {kind: all_reals}}

  - id: VM016
    title: Fully correct sequence of equation steps
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["3x - 5 = 7", "3x = 12", "x = 4"]
    expected: {status: verified, failed_step: null, is_solved_form: true}
  - id: VM017
    title: Incorrect final equation step
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["3x - 5 = 7", "3x = 12", "x = 3"]
    expected:
      status: wrong
      failed_step: 3
      is_solved_form: true
      original_solution_set: {kind: finite, values: ["4"]}
  - id: VM018
    title: First error is incorrect distribution
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["-2(x - 3) = 4", "-2x - 6 = 4"]
    expected:
      status: wrong
      failed_step: 2
      is_solved_form: false
      original_solution_set: {kind: finite, values: ["1"]}
    misconception: "The sign on the second term changed incorrectly during distribution."
  - id: VM019
    title: A root is lost by dividing by the variable
    check_type: step_validation
    curriculum_scope: out_of_curriculum_tool_test
    steps: ["x^2 = x", "x = 1"]
    expected:
      status: wrong
      failed_step: 2
      original_solution_set: {kind: finite, values: ["0", "1"]}
      failed_step_solution_set: {kind: finite, values: ["1"]}
  - id: VM020
    title: Correct one-step equation solution
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["x + 2 = 5", "x = 3"]
    expected: {status: verified, failed_step: null, is_solved_form: true}
  - id: VM027
    title: Correct but unfinished equation transformation
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["3x - 5 = 7", "3x = 12"]
    expected: {status: verified, failed_step: null, is_solved_form: false}
  - id: VM034
    title: Error carried forward consistently after a wrong step
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["-2(x - 3) = 4", "-2x - 6 = 4", "-2x = 10", "x = -5"]
    expected:
      status: wrong
      failed_step: 2
      is_solved_form: true
      original_solution_set: {kind: finite, values: ["1"]}
      steps_consistent_after_error: [3, 4]
    notes: "Steps 3 and 4 are valid relative to step 2; step 2 is the first error."

  - id: VM028
    title: Ambiguous coordinate-like comma notation
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "(1,5)"
    expected: {status: unverifiable, reason: ambiguous_comma_notation}
  - id: VM029
    title: Reject executable-looking input before parsing
    check_type: arithmetic
    curriculum_scope: tool_security_test
    input: "__import__('os')"
    expected: {status: unverifiable, reason: disallowed_characters_or_syntax, parser_invoked: false}
  - id: VM035
    title: Input longer than the allowed length
    check_type: arithmetic
    curriculum_scope: tool_security_test
    input_generator: {repeat: "1+", times: 300, suffix: "1"}
    expected: {status: unverifiable, reason: input_too_long, parser_invoked: false}
  - id: VM030
    title: Word problem without a formalised expression
    check_type: equation_solution
    curriculum_scope: tool_boundary_test
    input: "Een woordprobleem zonder formule of expliciete vergelijking."
    expected: {status: unverifiable, reason: requires_semantic_formalisation}

  - id: VM036
    title: Reject period-based thousands separator as ambiguous Dutch notation
    check_type: arithmetic
    curriculum_scope: tool_boundary_test
    input: "1.000 + 2"
    submitted_answer: "1002"
    expected: {status: unverifiable, reason: ambiguous_dot_notation, parser_invoked: false}
    notes: "In Dutch notation a period may be a thousands separator; do not silently treat 1.000 as 1."
  - id: VM037
    title: Variable denominator has a domain restriction
    check_type: expression_equivalence
    curriculum_scope: tool_boundary_test
    input: "x / x = 1"
    expected: {status: unverifiable, reason: variable_denominator_unsupported, parser_invoked: true}
    notes: "The expression is undefined at x=0; parser simplification must not erase that restriction."
  - id: VM038
    title: Two letters that are not an identity
    check_type: expression_equivalence
    curriculum_scope: tool_boundary_test
    input: "y = 2x"
    expected: {status: wrong, equivalent: false}
    notes: "Changed 26 Oct 2026 when letters other than x became supported; before that this case expected unsupported_variable."
  - id: VM039
    title: Division by zero described as impossible
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 : 0"
    submitted_answer: "kan niet"
    expected: {status: verified, reason: division_by_zero, parser_invoked: true}
  - id: VM040
    title: Division by zero described as nonexistent
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 : 0"
    submitted_answer: "bestaat niet"
    expected: {status: verified, reason: division_by_zero, parser_invoked: true}
  - id: VM041
    title: Constant denominator remains supported
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "x / 2 = 3"
    submitted_answer: "x = 6"
    expected: {status: verified, solution_set: {kind: finite, values: ["6"]}}
    notes: "Regression guard: the variable-denominator rule must not block ordinary divisions by a number."
  - id: VM042
    title: Variable denominator inside parentheses
    check_type: expression_equivalence
    curriculum_scope: tool_boundary_test
    input: "6 / (2x) = 3 / x"
    expected: {status: unverifiable, reason: variable_denominator_unsupported, parser_invoked: true}
  - id: VM043
    title: Saying "kan niet" for an expression that has a value
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "4 : 2"
    submitted_answer: "kan niet"
    expected: {status: wrong, exact_value: "2"}
  - id: VM044
    title: Dutch decimal comma still accepted after the dot rule
    check_type: arithmetic
    curriculum_scope: vwo1_candidate
    input: "1,5 + 1,5"
    submitted_answer: "3"
    expected: {status: verified, exact_value: "3"}
  - id: VM045
    title: Two independent errors in one worked solution
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["3(2x - 4) - 2(x + 5) = 4", "6x - 12 - 2x + 10 = 4", "4x - 2 = 4", "4x = 8", "x = 2"]
    expected:
      status: wrong
      failed_step: 2
      additional_invalid_steps: [4]
      steps_consistent_after_error: [3, 5]
      is_solved_form: true
      final_answer_correct: false
      original_solution_set: {kind: finite, values: ["13/2"]}
    notes: "Step 2: -2 x 5 written as +10. Step 3 carries that error correctly. Step 4: 4x - 2 = 4 gives 4x = 6, not 4x = 8. Step 5 is consistent with step 4."
  - id: VM046
    title: Second error cancels the first; final answer correct, reasoning not
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["2x + 3 = 7", "2x = 10", "2x = 4", "x = 2"]
    expected:
      status: wrong
      failed_step: 2
      additional_invalid_steps: [3]
      steps_consistent_after_error: [4]
      is_solved_form: true
      final_answer_correct: true
    notes: "The teacher must see that x = 2 is right but the working contains two invalid steps."
  - id: VM047
    title: Correct solution reports a correct final answer
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["3x - 5 = 7", "3x = 12", "x = 4"]
    expected:
      status: verified
      failed_step: null
      final_answer_correct: true
  - id: VM048
    title: Unfinished working has no final-answer verdict
    check_type: step_validation
    curriculum_scope: vwo1_candidate
    steps: ["3x - 5 = 7", "3x = 12"]
    expected:
      status: verified
      is_solved_form: false
      final_answer_correct: null

  # --- Letters other than x (tests written before the code: these fail until implemented) ---
  - id: VM049
    title: Distributing over two letters
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "2(a + b) = 2a + 2b"
    expected: {status: verified, equivalent: true}

  - id: VM050
    title: Multiplying terms with letters
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "3a · 2b = 6ab"
    expected: {status: verified, equivalent: true}
    notes: "ab means a times b; it is never a two-letter name."

  - id: VM051
    title: Confusing 3a with a cubed
    check_type: expression_equivalence
    curriculum_scope: vwo1_candidate
    input: "a + a + a = a³"
    expected: {status: wrong, equivalent: false}
    misconception: "Repeated addition (3a) confused with repeated multiplication (a³)."

  - id: VM052
    title: Squaring a sum term by term
    check_type: expression_equivalence
    curriculum_scope: out_of_curriculum_tool_test
    input: "(a + b)² = a² + b²"
    expected: {status: wrong, equivalent: false}

  - id: VM053
    title: Single letter other than x is the unknown
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "5p - 3 = 12"
    submitted_answer: "p = 3"
    expected:
      status: verified
      solution_set: {kind: finite, values: ["3"]}

  - id: VM054
    title: Correct value under the wrong letter
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "2t + 1 = 9"
    submitted_answer: "x = 4"
    expected:
      status: verified
      variable_mismatch: true
    notes: "Decision 26 Oct 2026: the value counts; the mismatch is reported as a warning field."

  - id: VM055
    title: Two letters and no unknown given
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "a + 2b = 10"
    submitted_answer: "a = 4"
    expected: {status: unverifiable, reason: ambiguous_unknown}

  - id: VM056
    title: Two letters with the unknown given
    check_type: equation_solution
    curriculum_scope: vwo1_candidate
    input: "a + 2b = 10"
    variable: "a"
    submitted_answer: "a = 10 - 2b"
    expected: {status: verified}

  - id: VM057
    title: Substituting a value into a letter formula
    check_type: formula_substitution
    curriculum_scope: vwo1_candidate
    input: "w = 4p + 10"
    substitutions: {p: "3"}
    submitted_answer: "w = 22"
    expected: {status: verified, exact_value: "22"}

  - id: VM058
    title: Reading 4p with p = 3 as 43
    check_type: formula_substitution
    curriculum_scope: vwo1_candidate
    input: "w = 4p + 10"
    substitutions: {p: "3"}
    submitted_answer: "w = 53"
    expected: {status: wrong, exact_value: "22"}
    misconception: "4p with p = 3 read as the number 43 instead of 4 × 3."

  - id: VM059
    title: Rewriting a formula for the other letter
    check_type: formula_rewrite
    curriculum_scope: vwo1_candidate
    input: "w = 4p + 10"
    submitted_answer: "p = (w - 10) / 4"
    expected: {status: verified}

  - id: VM060
    title: Wrong order of undoing operations
    check_type: formula_rewrite
    curriculum_scope: vwo1_candidate
    input: "w = 4p + 10"
    submitted_answer: "p = w / 4 - 10"
    expected: {status: wrong}
    misconception: "Divided by 4 before subtracting 10."

  - id: VM061
    title: Word formula is not supported yet
    check_type: formula_substitution
    curriculum_scope: vwo1_candidate
    input: "kosten = 3 × aantal + 5"
    substitutions: {aantal: "4"}
    submitted_answer: "kosten = 17"
    expected: {status: unverifiable, reason: word_variables_not_supported}

  - id: VM062
    title: Letter in the denominator is not supported yet
    check_type: formula_rewrite
    curriculum_scope: vwo1_candidate
    input: "v = s / t"
    submitted_answer: "s = v · t"
    expected: {status: unverifiable, reason: variable_denominator_unsupported}
    notes: "Planned later: accept with the condition t ≠ 0."

  - id: VM063
    title: Reserved letter e
    check_type: equation_solution
    curriculum_scope: tool_boundary_test
    input: "e + 2 = 5"
    submitted_answer: "e = 3"
    expected: {status: unverifiable, reason: reserved_symbol}

  - id: VM064
    title: Capital letter and decimal comma in a formula
    check_type: formula_substitution
    curriculum_scope: vwo1_candidate
    input: "K = 2,5a + 15"
    substitutions: {a: "4"}
    submitted_answer: "K = 25"
    expected: {status: verified, exact_value: "25"}
    notes: "Letters are case-sensitive: K and k are different variables."
