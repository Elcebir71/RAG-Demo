    kerndoel: VO-11B
    hv: false
    vwo_years: [2]
    evidence: ["KERN 2A 4.3-4.4"]
    confirmed: false
    verify_math: {status: partial, check_types: [answer_equivalence], tests: [VM099], note: "Converting between notations works; computing the probability itself is not checked."}

  - id: T22
    topic: "Systematisch tellen en kansregels (rooster-, boom- en wegendiagram, met en zonder terugleggen)"
    kerndoel: VO-11B
    hv: true
    vwo_years: [1, 2]
    evidence: ["KERN 1B W2", "KERN 2A 4.1-4.2, 4.5"]
    confirmed: false
    verify_math: {status: planned, note: "Needs n! and combinations in the parser."}

  # --- Kerndoel 12: patronen en verbanden ---
  - id: T23
    topic: "Formule bij een tabel of getallenrij; tabel, grafiek en formule omzetten"
    kerndoel: VO-12A
    hv: false
    vwo_years: [1]
