schema_version: 1
map_name: vwo_onderbouw
description: >-
  Curriculum map for vwo onderbouw (leerjaar 1-3): which topics exist, where they come from,
  and what verify_math can check today. Used to plan verify_math and, later, as data for
  find_curriculum_targets.

goal: >-
  Finish line for verify_math: every topic of the onderbouw kerndoelen (including the
  'Aanvulling havo-vwo' blocks) that is not out_of_scope has status 'supported'. The kerndoelen
  are national and fixed for the end of onderbouw; the order per leerjaar is not, so the goal
  is defined by kerndoel, not by year. verify_math itself does not depend on the year.

sources:
  kerndoelen:
    title: "Kerndoelen rekenen en wiskunde, voortgezet onderwijs (definitieve conceptkerndoelen, herziene versie 2025)"
    publisher: SLO
    url: "https://www.slo.nl/thema/meer/actualisatie-kerndoelen-examenprogramma/actualisatie-kerndoelen/definitieve-conceptkerndoelen-rekenen/"
    status: "In the law from August 2026; schools move to them step by step until August 2031."
    note: >-
      Topic descriptions below are short paraphrases, not the official text. Always check the
      official SLO document before quoting a kerndoel. 'hv' marks content from the
      'Aanvulling havo-vwo' blocks; vmbo uses the kerndoelen without these blocks.
  kerndoelen_2007:
    title: "Kerndoelen onderbouw vo, wiskunde (kerndoel 19 t/m 27)"
    publisher: SLO
    url: "https://www.slo.nl/publish/pages/2827/concretisering-kerndoelen-wiskunde-kerndoelen-voor-de-onderbuw-vo.pdf"
    note: >-
      The previous set, still in use at schools that have not yet moved to the new kerndoelen
      (transition until August 2031). Codes OB-19 .. OB-27. The mapping from topics to these
      codes is our own reading, not an official table.
  method:
    title: "Getal & Ruimte (Noordhoff), 12e editie, vwo 1"
    variant: "vwo (homogeneous class); to be confirmed from the book's cover"
    chapters_seen: ["H1 Figuren", "H2 Getallen en bewerkingen", "H3 Grafieken en formules", "H4 Rekenen in de praktijk", "H5 Lijnen en hoeken"]
    note: "Only chapter titles are used as labels; no exercises or text from the method are stored."
  method_2:
    title: "KERN Wiskunde, doorlopende leerlijn havo/vwo 1A, 1B, 2A, 2B (inhoudsopgaven)"
    variant: "havo/vwo (dakpanklas); paragraphs marked VWO are vwo-only"
    note: >-
      Used to check the typical years for leerjaar 1 and 2. Paragraphs marked 'VWO' in this
      method are vwo-only. Cited below as KERN 1A..2B with paragraph numbers; titles only.

  method_3:
    title: "Math4All, havo/vwo 1,2 (2026, adapted to the new kerndoelen)"
    url: "https://www.math4all.nl/overzichten/havo-vwo-1-2/59"
    variant: "havo/vwo, leerjaar 1 and 2 together (no split per year)"
    note: >-
      Public material in four domains: Rekenen (re), Meten en tekenen (me), Grafieken en
      formules (gr), Informatie verwerken (if). Cited as M4A re5.2 etc. Evidence that a topic
      belongs to leerjaar 1-2, not to one specific year. Titles only; Math4All is free for
      non-commercial use, its content is not copied.

conventions:
  kerndoel_codes: >-
    VO-10A = new kerndoel 10, onderdeel A (in the law from 2026). OB-22 = kerndoel 22 of the
    2007 set. Both are given because schools switch between August 2026 and August 2031.
    The kerndoelen are set for the end of onderbouw, not per year.
  method_variants: >-
    Methods print separate books for havo/vwo (dakpanklas) and vwo classes, and editions differ.
    Evidence from a method is only valid for the edition and variant named in sources. There is
    no state approval of textbooks (vrijheid van onderwijs, artikel 23 Grondwet); SLO sets the
    goals, schools and publishers choose how to reach them.
  typical_years: >-
    The leerjaar in which methods usually treat a topic (evidence lists the methods checked).
    Only an example order: schools choose their own method and order, so the real year comes
    from a school profile (method, edition, chapters per year), confirmed by a teacher.
    Used for generating exercises at the right level and for find_curriculum_targets, never
    by verify_math.
  ordering: >-
    New verify_math work is ordered by dependency first (√ before Pythagoras and the
    abc-formule) and then by how early and widely a topic appears in the methods.
  verify_math_status:
    supported: "verify_math checks this today, with acceptance tests"
    partial: "some forms can be checked; the note says which"
    planned: "checkable in principle; not built yet"
    out_of_scope: "cannot be verified symbolically (figures, modelling, interpretation, attitude)"

