<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="40" y="62" fill="#f8fafc" font-size="30" font-weight="700">Local RAG Document Assistant</text>
  <text x="40" y="92" fill="#94a3b8" font-size="16">Ask questions about your own PDFs — answers with page-level citations</text>

  <!-- Documents -->
  <g transform="translate(40,150)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
    <rect x="45" y="28" width="52" height="66" rx="4" fill="#f8fafc" opacity="0.15"/>
    <rect x="53" y="20" width="52" height="66" rx="4" fill="#e2e8f0"/>
    <rect x="61" y="34" width="34" height="4" rx="2" fill="#94a3b8"/>
    <rect x="61" y="44" width="28" height="4" rx="2" fill="#94a3b8"/>
    <rect x="61" y="54" width="34" height="4" rx="2" fill="#94a3b8"/>
    <rect x="61" y="64" width="22" height="4" rx="2" fill="#94a3b8"/>
    <text x="75" y="118" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Documents</text>
    <text x="75" y="137" fill="#94a3b8" font-size="12" text-anchor="middle">PDF · TXT · MD</text>
  </g>

  <line x1="196" y1="225" x2="234" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vector DB -->
  <g transform="translate(240,150)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
    <ellipse cx="75" cy="32" rx="36" ry="10" fill="#38bdf8"/>
    <path d="M39 32 v42 a36 10 0 0 0 72 0 v-42" fill="#0ea5e9" opacity="0.85"/>
    <ellipse cx="75" cy="53" rx="36" ry="10" fill="none" stroke="#0c4a6e" stroke-width="2"/>
    <text x="75" y="118" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Vector DB</text>
    <text x="75" y="137" fill="#94a3b8" font-size="12" text-anchor="middle">bge-m3 · ChromaDB</text>
  </g>

  <line x1="396" y1="225" x2="434" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <g transform="translate(440,150)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="75" cy="52" r="30" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="62" cy="44" r="5" fill="#a78bfa"/>
    <circle cx="88" cy="44" r="5" fill="#a78bfa"/>
    <circle cx="75" cy="64" r="5" fill="#a78bfa"/>
    <line x1="62" y1="44" x2="88" y2="44" stroke="#a78bfa" stroke-width="2"/>
    <line x1="62" y1="44" x2="75" y2="64" stroke="#a78bfa" stroke-width="2"/>
    <line x1="88" y1="44" x2="75" y2="64" stroke="#a78bfa" stroke-width="2"/>
    <text x="75" y="118" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Local LLM</text>
    <text x="75" y="137" fill="#94a3b8" font-size="12" text-anchor="middle">Ollama · llama3.2</text>
  </g>

  <line x1="596" y1="225" x2="634" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Answer -->
  <g transform="translate(640,150)">
    <rect width="120" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
    <rect x="18" y="20" width="84" height="56" rx="10" fill="#22c55e" opacity="0.9"/>
    <rect x="30" y="34" width="60" height="5" rx="2.5" fill="#052e16"/>
    <rect x="30" y="46" width="44" height="5" rx="2.5" fill="#052e16"/>
    <rect x="30" y="58" width="28" height="5" rx="2.5" fill="#052e16"/>
    <text x="60" y="118" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Answer</text>
    <text x="60" y="137" fill="#94a3b8" font-size="12" text-anchor="middle">+ sources [1][2]</text>
  </g>

  <text x="40" y="380" fill="#cbd5e1" font-size="14">100% local · no API keys · English / Dutch / Turkish</text>
  <text x="40" y="404" fill="#64748b" font-size="13">Python · Ollama · ChromaDB · Retrieval-Augmented Generation</text>
</svg>
